%YAML 1.2
---
$id: http://devicetree.org/schemas/memory-controllers/mediatek,mminfra.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek Multimedia Infrastructure

maintainers:
  - Zhengnan Chen <zhengan.chen@mediatek.com>

description: |
  The main function of Multimedia Infrastructure(mminfra) is
  Hardware Restore Engine(HRE).
  HRE is used to perform backup and restore hw register setting on
  MediaTek platform.
  GCE is macroscopically located within mminfra, and some critical
  GCE register backups depend on mminfra.

properties:
  compatible:
    enum:
      - mediatek,mt8189-mminfra

  clocks:
    description: |
      gce_d and gce_m and gce_26m are mandatory.
    items:
      - description: gce_d is used for one of gce register setting.
      - description: gce_m is used for another of gce register setting.
      - description: gce_26m is also used for all gce register setting.

  clock-names:
    minItems: 3
    maxItems: 3

  power-domains:
    maxItems: 1

  mediatek,mminfra:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: a phandle to the mminfra_config_clk syscon node.

required:
  - compatible
  - clocks
  - clock-names
  - power-domains
  - mediatek,mminfra

additionalProperties: false

examples:
  - |+
    #include <dt-bindings/clock/mediatek,mt8189-clk.h>
    #include <dt-bindings/power/mediatek,mt8189-power.h>

    mminfra {
      compatible = "mediatek,mt8189-mminfra";
      clocks = <&mminfra_config_clk CLK_MMINFRA_GCE_D>,
               <&mminfra_config_clk CLK_MMINFRA_GCE_M>,
               <&mminfra_config_clk CLK_MMINFRA_GCE_26M>;
      clock-names = "gce_d", "gce_m", "gce_26m";
      power-domains = <&scpsys MT8189_POWER_DOMAIN_MM_INFRA>;
      mediatek,mminfra = <&mminfra_config_clk>;
    };
