%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/ti,ts3usbca4.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: TI TS3USBCA4 TypeC SBU Multiplexer

maintainers:
  - Tommy Chen <tommyyl.chen@mediatek.com>

properties:
  compatible:
      const: ti,ts3usbca4

  reg:
    maxItems: 1

  orientation-switch:
    description: Flag the port as possible handler of orientation switching
    type: boolean

  port:
    $ref: /schemas/graph.yaml#/properties/port
    description:
      A port node to link the ts3usbca4 to a TypeC controller for the purpose of
      handling altmode muxing and orientation switching.

  mux3v3-supply:
    description: phandle to the regulator for the 3.3V supply

required:
  - compatible
  - reg
  - orientation-switch
  - port
  - mux3v3-supply

additionalProperties: false

examples:
  - |
    i2c6 {
        #address-cells = <1>;
        #size-cells = <0>;

        ts3usbca4@5d {
            compatible = "ti,ts3usbca4";
            reg = <0x5d>;
            orientation-switch;
            mux3v3-supply = <&ext_3v3>;
            status = "okay";

            port {
                typec_dp_sbu_mux: endpoint {
                    remote-endpoint = <&tcpc_typec_dp_sbu>;
                };
            };
        };
    };
...
