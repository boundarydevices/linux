%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/mediatek,mt6375-tcpc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediatTek MT6375 Type-C Port Switch and Power Delivery controller

maintainers:
  - Yuren Chen <ren_chen@richtek.com>

description: |
  MediaTek MT6375 is a multi-functional device.
  It integrates charger, ADC, regulators (VBUS),
  and TypeC Port Switch with Power Delivery controller.
  This document only describes MT6375 Type-C Port Switch and
  Power Delivery controller.

properties:
  compatible:
    enum:
      - mediatek,mt6375-tcpc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  wakeup-source:
    type: boolean

  connector:
    type: object
    $ref: /schemas/connector/usb-connector.yaml#
    unevaluatedProperties: false

additionalProperties: false

required:
  - compatible
  - connector
  - interrupts

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/usb/pd.h>
    #include <dt-bindings/mfd/mt6375.h>
    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      mt6375@34 {
        compatible = "mediatek,mt6375";
        reg = <0x34>;
        interrupts-extended = <&pio 9 IRQ_TYPE_LEVEL_LOW>;
        interrupt-controller;
        #interrupt-cells = <1>;

        tcpc {
          compatible = "mediatek,mt6375-tcpc";
          interrupts = <MT6375_PD_EVT>;

          connector {
            compatible = "usb-c-connector";
            label = "USB-C";
            data-role = "dual";
            power-role = "dual";
            try-power-role = "sink";
            source-pdos = <PDO_FIXED(5000, 500, PDO_FIXED_DUAL_ROLE | PDO_FIXED_DATA_SWAP)>;
            sink-pdos = <PDO_FIXED(5000, 2000, PDO_FIXED_DUAL_ROLE | PDO_FIXED_DATA_SWAP)>;
            op-sink-microwatt = <10000000>;

            ports {
              #address-cells = <1>;
              #size-cells = <0>;

              port@0 {
                reg = <0>;
                endpoint {
                  remote-endpoint = <&usb_hs>;
                };
              };
              port@1 {
                reg = <1>;
                endpoint {
                  remote-endpoint = <&usb_ss>;
                };
              };
              port@2 {
                reg = <2>;
                endpoint {
                  remote-endpoint = <&dp_aux>;
                };
              };
            };
          };
        };
      };
    };
...